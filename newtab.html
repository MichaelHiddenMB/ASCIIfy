<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <!-- The tab icon: the same grey Chrome logo Chrome's own new tab page shows, instead of the
       extension's icon (copied from Chrome's built-in images, at 1x and 2x for sharp screens). -->
  <link rel="icon" type="image/png" sizes="16x16" href="icons/newtab-tab-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/newtab-tab-32.png">
  <link rel="stylesheet" href="newtab.css">
  <!-- type="module" lets our JavaScript files import each other without a build step. -->
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <!-- The animated scene is painted onto this canvas, which sits behind everything else. -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Normal page elements layered on top of the canvas. -->
  <main id="overlay">
    <section id="clock">
      <pre id="clock-time"></pre>
      <p id="greeting"></p>
      <p id="clock-date"></p>
    </section>

    <form id="search" role="search" autocomplete="off">
      <input id="search-input" type="text" name="q" placeholder="search the web" aria-label="Search the web" autofocus>
    </form>
  </main>

  <button id="settings-toggle" type="button" aria-controls="settings-panel" aria-expanded="false">[ settings ]</button>

  <aside id="settings-panel" hidden>
    <h2>settings</h2>
    <form id="settings-form">
      <label>theme
        <select name="scene"></select>
      </label>
      <label>speed <output data-for="speed"></output>
        <input type="range" name="speed" min="0.25" max="2" step="0.25">
      </label>
      <label>animals <output data-for="density"></output>
        <input type="range" name="density" min="0" max="3" step="0.25">
      </label>
      <!-- data-scene: only shown while that theme is active -->
      <label data-scene="koi-pond">lily pads <output data-for="pads"></output>
        <input type="range" name="pads" min="0" max="3" step="0.25">
      </label>
      <label data-scene="meadow">flowers <output data-for="flowers"></output>
        <input type="range" name="flowers" min="0" max="3" step="0.25">
      </label>
      <label data-scene="beach">wave speed <output data-for="waves"></output>
        <input type="range" name="waves" min="0.25" max="2.5" step="0.25">
      </label>
      <label>your name
        <input type="text" name="name" maxlength="40" placeholder="for the greeting">
      </label>
      <div class="rule" aria-hidden="true"></div>
      <label class="check"><input type="checkbox" name="showClock"> show clock</label>
      <label class="check"><input type="checkbox" name="clock24"> 24-hour clock</label>
      <label class="check"><input type="checkbox" name="showSearch"> show search bar</label>
      <label class="check" data-scene="koi-pond"><input type="checkbox" name="light"> moonlight on the water</label>
      <label class="check" data-scene="meadow"><input type="checkbox" name="meadowPond"> pond and tree</label>
      <label class="check" data-scene="meadow"><input type="checkbox" name="sunset"> sunset</label>
      <label class="check" data-scene="beach"><input type="checkbox" name="beachSunset"> sunset</label>
    </form>
  </aside>
</body>
</html>
